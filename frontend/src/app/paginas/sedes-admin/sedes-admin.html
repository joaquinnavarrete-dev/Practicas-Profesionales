<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion de Sedes</h2>
        <button class="btn btn-primary" (click)="abrirCrear()">+ Nueva Sede</button>
    </div>

    <div class="card mb-4" *ngIf="mostrarFormulario()">
        <div class="card-header">
            <h5>{{ editandoId() ? 'Editar Sede' : 'Registrar Nueva Sede' }}</h5>
        </div>
        <div class="card-body">
            <form (ngSubmit)="guardar()">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.nombre" name="nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Direccion *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.direccion" name="direccion"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Telefono *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.telefono" name="telefono"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Electrónico *</label>
                        <input type="email" class="form-control" [(ngModel)]="formData.email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Horario de Atencion *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.horario_atencion"
                            name="horario_atencion" required>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="button" class="btn btn-secondary me-2" (click)="cerrarFormulario()">Cancelar</button>
                    <button type="submit" class="btn btn-success" [disabled]="guardando()">
                        {{ guardando() ? 'Guardando...' : (editandoId() ? 'Actualizar' : 'Guardar') }}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Direccion</th>
                    <th>Teléfono</th>
                    <th>Correo Electronico</th>
                    <th>Horario de Atencion</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let s of listaSedes()">
                    <td>{{ s.nombre }}</td>
                    <td>{{ s.direccion }}</td>
                    <td>{{ s.telefono }}</td>
                    <td>{{ s.email }}</td>
                    <td>{{ s.horario_atencion }}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" (click)="abrirEditar(s)">Editar</button>
                        <button class="btn btn-sm btn-danger" (click)="eliminar(s)">Eliminar</button>
                    </td>
                </tr>
                <tr *ngIf="listaSedes().length === 0 && !cargando()">
                    <td colspan="7" class="text-center">No hay sedes registradas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
