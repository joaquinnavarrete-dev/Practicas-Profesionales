<div class="register-doctor-wrapper">

  <header class="form-header-bar">
    <div class="header-titles">
      <span class="back-link" routerLink="/admin/medicos">← Volver al Cuerpo Médico</span>
      <h1 class="main-title">Modificar Datos del Profesional</h1>
      <p class="sub-title">Actualice la información profesional y especialidad del médico ID #{{ medicoId() }}.</p>
    </div>
  </header>

  <main class="form-content-body">

    <div *ngIf="errorMessage()" class="error-banner">
      <span>{{ errorMessage() }}</span>
    </div>

    <div *ngIf="cargando()" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando información del profesional médico...</p>
    </div>

    <form class="doctor-form-card" (ngSubmit)="guardarCambios()" *ngIf="!cargando()">

      <div class="form-section">
        <h3 class="section-title">1. Datos Personales y de Contacto</h3>

        <div class="form-grid-2">
          <div class="form-group">
            <label>NOMBRE(S) *</label>
            <input type="text" [(ngModel)]="medicoForm.nombre" name="nombre" placeholder="Ej. Roberto Carlos"
              required />
          </div>

          <div class="form-group">
            <label>APELLIDO(S) *</label>
            <input type="text" [(ngModel)]="medicoForm.apellido" name="apellido" placeholder="Ej. Giménez" required />
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>TELÉFONO / CELULAR DE CONTACTO *</label>
            <input type="text" [(ngModel)]="medicoForm.telefono" name="telefono" placeholder="Ej. +54 9 11 4402-9911"
              required />
          </div>

          <div class="form-group">
            <label>SEDE INSTITUCIONAL</label>
            <input type="text" value="Sede Central (Av. San Gabriel 1420)" disabled />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">2. Credenciales y Especialidad Médica</h3>

        <div class="form-grid-2">
          <div class="form-group">
            <label>NÚMERO DE MATRÍCULA PROFESIONAL *</label>
            <input type="text" [(ngModel)]="medicoForm.matricula" name="matricula" placeholder="Ej. M.N. 142.589"
              required />
          </div>

          <div class="form-group">
            <label>ESPECIALIDAD ASIGNADA *</label>
            <select [(ngModel)]="medicoForm.idEspecialidad" name="idEspecialidad" required>
              <option *ngFor="let esp of especialidades()" [ngValue]="esp.idEspecialidad">
                {{ esp.nombre }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-actions-footer">
        <button type="button" class="btn-cancel" routerLink="/admin/medicos">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="guardando()">
          <span *ngIf="!guardando()">💾 Guardar Cambios</span>
          <span *ngIf="guardando()">Guardando...</span>
        </button>
      </div>

    </form>
  </main>

</div>
