<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Administración de Empresas</h2>
        <button class="btn btn-primary" (click)="abrirCrear()">+ Nueva Empresa</button>
    </div>

    <div class="card mb-4" *ngIf="mostrarFormulario()">
        <div class="card-header">
            <h5>{{ editandoId() ? 'Editar Empresa' : 'Registrar Nueva Empresa' }}</h5>
        </div>
        <div class="card-body">
            <form (ngSubmit)="guardar()">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.nombre" name="nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">CUIT *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.cuit" name="cuit" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Domicilio *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.domicilio" name="domicilio"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.telefono" name="telefono"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Electrónico *</label>
                        <input type="email" class="form-control" [(ngModel)]="formData.email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rubro *</label>
                        <input type="text" class="form-control" [(ngModel)]="formData.rubro" name="rubro" required>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="button" class="btn btn-secondary me-2" (click)="cerrarFormulario()">Cancelar</button>
                    <button type="submit" class="btn btn-success" [disabled]="guardando()">
                        {{ guardando() ? 'Guardando...' : (editandoId() ? 'Actualizar' : 'Guardar') }}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>CUIT</th>
                    <th>Domicilio</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Rubro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let emp of empresas()">
                    <td>{{ emp.nombre }}</td>
                    <td>{{ emp.cuit }}</td>
                    <td>{{ emp.domicilio }}</td>
                    <td>{{ emp.telefono }}</td>
                    <td>{{ emp.email }}</td>
                    <td>{{ emp.rubro }}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" (click)="abrirEditar(emp)">Editar</button>
                        <button class="btn btn-sm btn-danger" (click)="eliminar(emp)">Eliminar</button>
                    </td>
                </tr>
                <tr *ngIf="empresas().length === 0 && !cargando()">
                    <td colspan="7" class="text-center">No hay empresas registradas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
