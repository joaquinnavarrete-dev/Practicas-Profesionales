<div class="login-wrapper">
  <div class="login-card">

    <div class="card-header">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" class="badge-icon" fill="currentColor">
          <path
            d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 12h-2v-3H8V9h3V6h2v3h3v2h-3v3z" />
        </svg>
      </div>
      <h1 class="login-title">San Gabriel</h1>
      <p class="login-subtitle">Acceso al Sistema de Gestión Médica</p>
    </div>

    <div *ngIf="errorMessage" class="login-error-alert">
      <svg viewBox="0 0 24 24" class="alert-icon" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form class="login-form" (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label for="nombreUsuario">Usuario o Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="nombreUsuario" [(ngModel)]="nombreUsuario" name="nombreUsuario"
            placeholder="Ej: admin o juanperez" autocomplete="username" required />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
        </div>
        <div class="input-wrapper">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input [type]="mostrarPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="toggle-password" (click)="toggleMostrarPassword()"
            title="Mostrar / ocultar contraseña">
            <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login-submit" [disabled]="cargando">
        <span *ngIf="!cargando">Iniciar Sesión</span>
        <span *ngIf="cargando">Iniciando sesión...</span>
      </button>

      <div class="register-redirect">
        <span>¿Sos nuevo paciente?</span>
        <a routerLink="/registro" class="register-link">Crear una cuenta</a>
      </div>

    </form>

    <div class="card-footer">
      <div class="secure-badge">
        <svg viewBox="0 0 24 24" class="shield-mini" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v6h-2V7zm0 8h2v2h-2v-2z" />
        </svg>
        <span>Acceso Seguro y Encriptado (JWT)</span>
      </div>
    </div>

  </div>
</div>
