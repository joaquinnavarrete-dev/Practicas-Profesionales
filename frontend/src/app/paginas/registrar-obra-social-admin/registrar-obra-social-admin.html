<div class="register-os-wrapper">

  <app-admin-topbar titulo="Gestión de Convenios y Coberturas" icono="🛡️"></app-admin-topbar>

  <header class="form-header-bar">
    <div class="header-titles">
      <span class="back-link" routerLink="/admin/obras-sociales">← Volver al Padrón de Obras Sociales</span>
      <h1 class="main-title">Alta de Nueva Obra Social / Prepaga</h1>
      <p class="sub-title">Configure los datos fiscales, planes asociados y canales de contacto para la validación de
        turnos.</p>
    </div>
  </header>

  <main class="form-content-body">
    <form class="os-form-card" (ngSubmit)="guardarObraSocial()">

      <div class="form-section">
        <h3 class="section-title">1. Información Institucional</h3>

        <div class="form-grid-2">
          <div class="form-group">
            <label>RAZÓN SOCIAL COMPLETA *</label>
            <input type="text" [(ngModel)]="obraSocialForm.nombre" name="nombre"
              placeholder="Ej. Obra Social de la Sanidad Argentina" required />
          </div>

          <div class="form-group">
            <label>SIGLAS / NOMBRE COMERCIAL *</label>
            <input type="text" [(ngModel)]="obraSocialForm.siglas" name="siglas" placeholder="Ej. OSSACRA" required />
          </div>
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
          <label>ESTADO INICIAL EN EL SISTEMA *</label>
          <select [(ngModel)]="obraSocialForm.estado" name="estado">
            <option value="Activa">Activa (Habilitada para turnos y cobros)</option>
            <option value="Suspendida">Suspendida temporalmente</option>
          </select>
        </div>
      </div>

      <div class="form-actions-footer">
        <button type="button" class="btn-cancel" routerLink="/admin/obras-sociales">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="guardando()">
          <span *ngIf="!guardando()">💾 Registrar Obra Social</span>
          <span *ngIf="guardando()">Guardando obra social...</span>
        </button>
      </div>

    </form>
  </main>

</div>
