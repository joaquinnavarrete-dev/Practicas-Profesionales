<aside class="sidebar-container">

  <div class="sidebar-header" routerLink="/admin">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" class="cross-icon" fill="currentColor">
        <path
          d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 12h-2v-3H8V9h3V6h2v3h3v2h-3v3z" />
      </svg>
    </div>
    <div class="sidebar-brand">
      <span class="name">{{ authService.currentUser()?.nombreUsuario || 'Clínica San Gabriel' }}</span>
      <span class="badge-role">{{ rolFormateado }}</span>
    </div>
  </div>

  <div class="sidebar-cta">
    <button class="btn-new-turno" routerLink="/turnos/solicitar">
      <span class="plus-sign">+</span>
      <span>Nuevo Turno</span>
    </button>
  </div>

  <nav class="sidebar-menu">

    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
      <span class="menu-icon">⊞</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/admin/turnos" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🕒</span>
      <span>Gestión de Turnos</span>
    </a>

    <a *ngIf="authService.isMedico() || authService.isAdmin()" routerLink="/admin/pacientes-por-medico"
      routerLinkActive="active" class="menu-item">
      <span class="menu-icon">👥</span>
      <span>Pacientes por Médico</span>
    </a>

    <a *ngIf="authService.isMedico() || authService.isAdmin()" routerLink="/admin/dias-atencion"
      routerLinkActive="active" class="menu-item">
      <span class="menu-icon">📅</span>
      <span>Días de Atención</span>
    </a>

    <a *ngIf="authService.isRecepcionista() || authService.isAdmin()" routerLink="/admin/obras-sociales"
      routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🛡️</span>
      <span>Obras Sociales</span>
    </a>

    <a *ngIf="authService.isRecepcionista() || authService.isAdmin()" routerLink="/admin/pacientes"
      routerLinkActive="active" class="menu-item">
      <span class="menu-icon">👤</span>
      <span>Pacientes</span>
    </a>

    <a *ngIf="authService.isAdmin()" routerLink="/admin/especialidades" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">⚕️</span>
      <span>Especialidades</span>
    </a>

    <a *ngIf="authService.isAdmin()" routerLink="/admin/medicos" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🩺</span>
      <span>Cuerpo Médico</span>
    </a>

    <a *ngIf="authService.isAdmin()" routerLink="/admin/usuarios" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">👥</span>
      <span>Usuarios y Roles</span>
    </a>

  </nav>

  <div class="sidebar-footer">
    <a routerLink="/" class="footer-link">
      <span class="link-icon">🌐</span>
      <span>Ver Sitio Público</span>
    </a>
    <button class="btn-logout" (click)="cerrarSesion()">
      <span class="link-icon">🚪</span>
      <span>Cerrar Sesión</span>
    </button>
  </div>

</aside>
