<aside class="sidebar-container">
  <!-- Identidad Institucional San Gabriel -->
  <div class="sidebar-header" routerLink="/dashboard">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" class="cross-icon" fill="currentColor">
        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 12h-2v-3H8V9h3V6h2v3h3v2h-3v3z"/>
      </svg>
    </div>
    <div class="sidebar-brand">
      <span class="name">Clínica San Gabriel</span>
      <span class="badge-role">Gestión Médica</span>
    </div>
  </div>

  <!-- Botón Destacado de Acción Rápida -->
  <div class="sidebar-cta">
    <button class="btn-new-turno" routerLink="/turnos/nuevo">
      <span class="plus-sign">+</span>
      <span>Nuevo Turno</span>
    </button>
  </div>

  <!-- Navegación por Módulos -->
  <nav class="sidebar-menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">⊞</span>
      <span>Dashboard</span>
    </a>
    <a routerLink="/usuarios" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">👥</span>
      <span>Usuarios</span>
    </a>
    <a routerLink="/pacientes" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">👤</span>
      <span>Pacientes</span>
    </a>
    <a routerLink="/medicos" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🩺</span>
      <span>Médicos</span>
    </a>
    <a routerLink="/especialidades" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">⚕️</span>
      <span>Especialidades</span>
    </a>
    <a routerLink="/obras-sociales" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🛡️</span>
      <span>Obras Sociales</span>
    </a>
    <a routerLink="/agendas" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">📅</span>
      <span>Agendas</span>
    </a>
    <a routerLink="/turnos" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">🕒</span>
      <span>Turnos</span>
    </a>
    <a routerLink="/informes" routerLinkActive="active" class="menu-item">
      <span class="menu-icon">📄</span>
      <span>Informes</span>
    </a>
  </nav>

  <!-- Acciones al Pie -->
  <div class="sidebar-footer">
    <a href="#ayuda" class="footer-link">
      <span class="link-icon">❓</span>
      <span>Ayuda</span>
    </a>
    <button class="btn-logout" (click)="cerrarSesion()">
      <span class="link-icon">🚪</span>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>
