<div class="modal-backdrop" *ngIf="modalService.state() as state" (click)="onBackdropClick($event)" aria-modal="true"
  role="dialog">
  <div class="modal-card" [ngClass]="'modal-' + (state.tipo || 'warning')">
    <div class="modal-header-icon">

      <div class="icon-circle icon-danger" *ngIf="state.tipo === 'danger'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>

      <div class="icon-circle icon-warning" *ngIf="state.tipo !== 'danger'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
    </div>

    <div class="modal-content">
      <h3 class="modal-title">{{ state.titulo }}</h3>
      <p class="modal-message">{{ state.mensaje }}</p>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-modal-cancel" (click)="modalService.cancelar()">
        {{ state.textoCancelar || 'Cancelar' }}
      </button>

      <button type="button" class="btn-modal-confirm" [ngClass]="state.tipo === 'danger' ? 'btn-danger' : 'btn-primary'"
        (click)="modalService.aceptar()">
        {{ state.textoConfirmar || 'Confirmar' }}
      </button>
    </div>
  </div>
</div>
