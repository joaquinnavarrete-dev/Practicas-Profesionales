<header class="navbar-portal">
  <div class="brand-group" routerLink="/">
    <div class="logo-shield">
      <svg viewBox="0 0 24 24" class="shield-svg" fill="currentColor">
        <path
          d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 12h-2v-3H8V9h3V6h2v3h3v2h-3v3z" />
      </svg>
    </div>
    <div class="brand-titles">
      <span class="brand-name">SAN GABRIEL</span>
      <span class="brand-subtitle">CLÍNICA PRIVADA</span>
    </div>
  </div>

  <nav class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/especialidades" routerLinkActive="active">Especialidades</a>
    <a routerLink="/turnos/solicitar" routerLinkActive="active">Solicitar Turno</a>
  </nav>

  <div class="nav-actions">
    <span class="badge-guardia">
      <span class="asterisk-icon">✱</span>
      <span>Guardia 24hs</span>
    </span>

    <ng-container *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" class="btn-portal-blue">
        <svg class="portal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
        </svg>
        <span>Ingresar</span>
      </a>

      <a routerLink="/registro" class="btn-registro-nav">
        <span>Crear Cuenta</span>
      </a>
    </ng-container>

    <ng-container *ngIf="authService.isLoggedIn()">
      <a *ngIf="esPersonalClinico()" routerLink="/admin" class="btn-panel-admin">
        <span class="panel-icon">⚙️</span>
        <span>Panel Admin</span>
      </a>

      <div class="user-chip">
        <div class="user-avatar-circle">
          {{ authService.currentUser()?.nombreUsuario?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
        <div class="user-details">
          <span class="user-name">{{ authService.currentUser()?.nombreUsuario }}</span>
          <span class="user-role-badge">{{ authService.userRole()?.replace('ROLE_', '') }}</span>
        </div>
        <button (click)="cerrarSesion()" class="btn-logout-nav" title="Cerrar Sesión">
          <svg viewBox="0 0 24 24" class="logout-icon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </ng-container>
  </div>
</header>
