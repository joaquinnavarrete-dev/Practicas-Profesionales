<header class="topbar-admin">
  <div class="topbar-left">
    <div class="module-title-box">
      <span class="module-icon">{{ icono }}</span>
      <h2 class="module-title">{{ titulo }}</h2>
    </div>
  </div>

  <div class="topbar-right">
    <div class="profile-card">
      <div class="avatar-ph">{{ inicialUsuario() }}</div>
      <div class="profile-info">
        <span class="profile-name">{{ nombreUsuario() }}</span>
        <span class="profile-role">{{ rolFormateado() }}</span>
      </div>
    </div>

    <button type="button" class="btn-topbar-logout" (click)="cerrarSesion()" title="Cerrar Sesión">
      <svg viewBox="0 0 24 24" class="logout-icon" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Salir</span>
    </button>
  </div>
</header>
