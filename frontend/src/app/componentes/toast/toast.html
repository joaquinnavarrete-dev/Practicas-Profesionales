<div class="toast-container" *ngIf="notify.toasts().length > 0" aria-live="polite">
  <div 
    class="toast-card" 
    *ngFor="let t of notify.toasts()" 
    [ngClass]="'toast-' + t.tipo"
  >
    <div class="toast-icon-box">
      <!-- Éxito -->
      <svg *ngIf="t.tipo === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <!-- Error -->
      <svg *ngIf="t.tipo === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <!-- Warning -->
      <svg *ngIf="t.tipo === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <!-- Info -->
      <svg *ngIf="t.tipo === 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <div class="toast-body">
      <h4 class="toast-title" *ngIf="t.titulo">{{ t.titulo }}</h4>
      <p class="toast-message">{{ t.mensaje }}</p>
    </div>

    <button class="toast-btn-close" (click)="cerrar(t)" title="Cerrar notificación">
      ✕
    </button>
  </div>
</div>
